[project]
name = "boosted-magics"
version = "0.0.1"
description = "Metakernel magics with TAB completion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["metakernel>=1.0.0", "statikomand>=0.1.1"]

[tool.setuptools.packages.find]
include = ["./boosted_magics"]

[dependency-groups]
dev = ["jupyter-console>=6.6.3"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
