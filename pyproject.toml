[project]
name = "boosted-magics"
version = "0.0.2"
description = "Metakernel magics with TAB completion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["metakernel>=1.0.4", "statikomand>=0.1.1"]

[tool.hatch.build.targets.sdist]
include = ["/boosted_magics"]

[dependency-groups]
dev = ["jupyter-client>=8.9.1", "jupyter-console>=6.6.3"]

[build-system]
requires = ["hatchling>=1.10.0"]
build-backend = "hatchling.build"
